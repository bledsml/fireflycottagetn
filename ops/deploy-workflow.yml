name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"   # refresh availability and minimum stays every 6 hours
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh calendar from Hospitable
        env:
          HOSPITABLE_TOKEN: ${{ secrets.HOSPITABLE_TOKEN }}
        run: python3 scripts/refresh_calendar.py
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R index.html images calendar.json CNAME .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://fireflycottagetn.com
    steps:
      - uses: actions/deploy-pages@v4
